# [mapping] MySQL's schemas written as PostgreSQL's (src/mapping.rs): the rules as in
# postgres-mysql.yaml. A type as MySQL's COLUMN_TYPE writes it, lower-cased; a key that counts
# by itself as postgres-mysql.yaml writes it, `<int type> auto_increment`.
from: mysql
to: postgres
default:
  types:
    - { match: 'smallint(?:\s*\(\d+\))?\s+auto_increment', to: 'smallserial' }
    - { match: '(?:int|integer|mediumint)(?:\s*\(\d+\))?\s+auto_increment', to: 'serial' }
    - { match: 'bigint(?:\s*\(\d+\))?\s+auto_increment', to: 'bigserial' }
    # tinyint(1) is MySQL's boolean
    - { match: 'tinyint\s*\(\s*1\s*\)|bool|boolean', to: 'boolean', note: 'a value other than 0 and 1 fails on load' }  # [review 2026-11-19]
    - { match: 'tinyint(?:\s*\(\d+\))?(?:\s+unsigned)?(?:\s+zerofill)?|smallint(?:\s*\(\d+\))?', to: 'smallint' }
    - { match: 'smallint(?:\s*\(\d+\))?\s+unsigned(?:\s+zerofill)?|mediumint(?:\s*\(\d+\))?(?:\s+unsigned)?(?:\s+zerofill)?|int(?:eger)?(?:\s*\(\d+\))?', to: 'integer' }
    - { match: 'int(?:eger)?(?:\s*\(\d+\))?\s+unsigned(?:\s+zerofill)?|bigint(?:\s*\(\d+\))?', to: 'bigint' }
    - { match: 'bigint(?:\s*\(\d+\))?\s+unsigned(?:\s+zerofill)?', to: 'numeric(20)', note: 'an unsigned bigint is past bigint: kept as numeric(20)' }
    # [review 2026-11-19] unsigned and zerofill are MySQL's display and range options: the value as it is
    - { match: 'float(?:\s*\(\d+(,\d+)?\))?(?:\s+unsigned)?(?:\s+zerofill)?', to: 'real' }
    - { match: 'double(?: precision)?(?:\s*\(\d+,\d+\))?(?:\s+unsigned)?(?:\s+zerofill)?', to: 'double precision' }
    - { match: '(?:decimal|numeric)\s*\(\s*(\d+)\s*,\s*(\d+)\s*\)(?:\s+unsigned)?(?:\s+zerofill)?', to: 'numeric($1,$2)' }
    - { match: '(?:decimal|numeric)\s*\(\s*(\d+)\s*\)(?:\s+unsigned)?(?:\s+zerofill)?', to: 'numeric($1)' }
    - { match: '(?:decimal|numeric)(?:\s+unsigned)?(?:\s+zerofill)?', to: 'numeric(10,0)' }
    - { match: 'varchar\s*\(\s*(\d+)\s*\)', to: 'varchar($1)' }
    - { match: 'char\s*\(\s*(\d+)\s*\)', to: 'char($1)' }
    - { match: 'tinytext|text|mediumtext|longtext', to: 'text' }
    - { match: '(?:tinyblob|blob|mediumblob|longblob)|(?:var)?binary\s*\(\s*\d+\s*\)', to: 'bytea' }
    - { match: 'date', to: 'date' }
    - { match: 'datetime\s*\(\s*(\d)\s*\)', to: 'timestamp($1)' }
    - { match: 'datetime', to: 'timestamp(0)' }
    # MySQL's timestamp is stored in UTC and shown in the session's zone
    - { match: 'timestamp\s*\(\s*(\d)\s*\)', to: 'timestamptz($1)' }
    - { match: 'timestamp', to: 'timestamptz(0)' }
    # [review 2026-11-19] MySQL's time reaches 838 hours either way: a value past a day fails on load
    - { match: 'time\s*\(\s*(\d)\s*\)', to: 'time($1)', note: 'a MySQL time past a day or negative fails on load' }
    - { match: 'time', to: 'time(0)', note: 'a MySQL time past a day or negative fails on load' }
    - { match: 'year(?:\s*\(4\))?', to: 'smallint' }
    - { match: 'json', to: 'jsonb', note: 'jsonb keeps no key order, whitespace or duplicate keys' }  # [review 2026-11-19]
    - { match: 'bit\s*\(\s*1\s*\)', to: 'boolean' }
    - { match: 'bit\s*\(\s*(\d+)\s*\)', to: 'bit($1)' }
    - { match: "enum\\s*\\(.*\\)", to: 'text', note: 'its values are not checked here: add a CHECK by hand' }
    - { match: "set\\s*\\(.*\\)", to: 'text', note: 'its values are not checked here' }
  defaults:
    - { match: 'current_timestamp(?:\s*\(\s*\d?\s*\))?|now\(\s*\d?\s*\)', type: 'date', to: 'CURRENT_DATE' }
    - { match: 'current_timestamp(?:\s*\(\s*\d?\s*\))?|now\(\s*\d?\s*\)|localtimestamp(?:\(\))?', to: 'now()' }
    - { match: '\(?\s*curdate\(\)\s*\)?|\(?\s*current_date(?:\(\))?\s*\)?', to: 'CURRENT_DATE' }
    - { match: '\(?\s*curtime\(\)\s*\)?|\(?\s*current_time(?:\(\))?\s*\)?', to: 'CURRENT_TIME' }
    - { match: '\(\s*uuid\(\)\s*\)|uuid\(\)', to: 'gen_random_uuid()' }
    # a boolean's default as MySQL keeps it
    - { match: "0|b'0'|false", type: 'tinyint\s*\(\s*1\s*\)|bool|boolean|bit\s*\(\s*1\s*\)', to: 'false' }
    - { match: "1|b'1'|true", type: 'tinyint\s*\(\s*1\s*\)|bool|boolean|bit\s*\(\s*1\s*\)', to: 'true' }
    - { match: '\(.*\)', refuse: "an expression of MySQL's own functions: write it for PostgreSQL by hand" }
  features:
    - { at: column.index.using, value: btree, keep: true }
    - { at: column.index.using, value: hash, keep: true }
    - { at: column.index.using, refuse: 'an index method PostgreSQL has not under that name (fulltext, spatial)' }
    # MySQL's triggers are SQL of their own, not a function's
    - { at: table.triggers, drop: true }
    - { at: table.grant, drop: true, note: "MySQL's privileges are its accounts', not PostgreSQL's roles" }
    - { at: table.owner, drop: true }
    - { at: schema.owner, drop: true }
    - { at: column.partition_by, refuse: "a partition: PostgreSQL's are declared apart, as tables" }
    - { at: table.data, keep: true, note: "its rows as written: MySQL's literals (0 and 1 for booleans) are not converted" }
    - { at: table.data_file, keep: true, note: "its file's rows as written: MySQL's literals are not converted" }
