name: ci

# The tests with each feature set, and the line coverage of them all: under 71% fails
# the run. The coverage badge is our own, no third party: drawn from lcov.info and kept
# on the `badges` branch (the coverage job's last step).
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a branch's newer push cancels its older run; on main each run stands (the badge):
  # a cancelled run there shows as failing
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # default; with slog, the executed SQL logged at debug
        features: ["", "--features slog"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # tests/pg_errors.rs makes a throwaway cluster of its own with initdb, on a unix
      # socket: the binaries, not a service. Without them its tests skip and pass
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: cargo test ${{ matrix.features }}

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the coverage badge's push, to the badges branch
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # the gate counts on it too: a skipped cluster drops the coverage under it.
      # 71: the 71.5% measured when it was set (table.rs's DDL mostly untested), not 90
      # as diff-doc-rs - raise it as the tests grow
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: cargo llvm-cov --features slog --lcov --output-path lcov.info --fail-under-lines 71
      # [coverage] our own badge, no third party: lcov.info's line coverage, drawn by
      # .github/coverage-badge.py and kept on the `badges` branch - one commit, replaced
      # each time - which the README shows. On a push to the default branch only: a pull
      # request measures and gates, no more
      - name: coverage badge
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 .github/coverage-badge.py lcov.info /tmp/badges/coverage.svg)
          cd /tmp/badges
          git init -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "coverage ${pct}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
