# [i18n] see lib.yml - the YAML validator's, each line of an SG-E009, so without a code
# of its own. The schema's own errors (malformed, *_array, *_needs, ...) concern
# schema.yaml, which comes with schema_guard
_version: 2
validation.wrong_type:
  en: "wrong type, expected %{expected} got %{actual}"
  ru: "неверный тип: ожидается %{expected}, а получен %{actual}"
  fr: "type incorrect : %{expected} attendu, %{actual} reçu"
  de: "falscher Typ: erwartet %{expected}, erhalten %{actual}"
  zh: "类型错误：应为 %{expected}，实际为 %{actual}"
  ja: "型が違います：%{expected} が必要ですが %{actual} です"
validation.special:
  en: "special requirements for field not met: %{error}"
  ru: "не выполнены особые требования к полю: %{error}"
  fr: "exigences particulières du champ non remplies : %{error}"
  de: "besondere Anforderungen an das Feld nicht erfüllt: %{error}"
  zh: "字段的特殊要求未满足：%{error}"
  ja: "フィールドの特別な要件を満たしていません：%{error}"
validation.field_missing:
  en: "field '%{field}' missing"
  ru: "нет поля '%{field}'"
  fr: "champ '%{field}' manquant"
  de: "Feld '%{field}' fehlt"
  zh: "缺少字段 '%{field}'"
  ja: "フィールド '%{field}' がありません"
validation.extra_field:
  en: "field '%{field}' is not specified in the schema"
  ru: "поля '%{field}' нет в схеме"
  fr: "le champ '%{field}' n'est pas défini dans le schéma"
  de: "Feld '%{field}' ist im Schema nicht vorgesehen"
  zh: "模式中没有定义字段 '%{field}'"
  ja: "フィールド '%{field}' はスキーマに定義されていません"
validation.unknown_type:
  en: "unknown type specified: %{unknown}"
  ru: "указан неизвестный тип: %{unknown}"
  fr: "type inconnu : %{unknown}"
  de: "unbekannter Typ angegeben: %{unknown}"
  zh: "指定了未知类型：%{unknown}"
  ja: "不明な型が指定されています：%{unknown}"
validation.multiple:
  en: "multiple errors were encountered: %{errors}"
  ru: "обнаружено несколько ошибок: %{errors}"
  fr: "plusieurs erreurs rencontrées : %{errors}"
  de: "mehrere Fehler aufgetreten: %{errors}"
  zh: "遇到多个错误：%{errors}"
  ja: "複数のエラーがあります：%{errors}"
validation.unknown_schema:
