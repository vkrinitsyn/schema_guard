# [i18n] see lib.yml - tables, and their columns, indexes, grants, triggers
_version: 2
table.in_file:
  en: ", found in file: %{file}"
  ru: ", в файле: %{file}"
  fr: ", dans le fichier : %{file}"
  de: ", in der Datei: %{file}"
  zh: "，位于文件：%{file}"
  ja: "（ファイル：%{file}）"
table.source:
  en: ", source: %{file}"
  ru: ", источник: %{file}"
  fr: ", source : %{file}"
  de: ", Quelle: %{file}"
  zh: "，来源：%{file}"
  ja: "（ソース：%{file}）"
table.column:
  en: "SG-E040 %{err} (column %{index} of %{count}) on table: %{table}%{in_file}"
  ru: "SG-E040 %{err} (столбец %{index} из %{count}) в таблице: %{table}%{in_file}"
  fr: "SG-E040 %{err} (colonne %{index} sur %{count}) de la table : %{table}%{in_file}"
  de: "SG-E040 %{err} (Spalte %{index} von %{count}) in Tabelle: %{table}%{in_file}"
  zh: "SG-E040 %{err}（第 %{index} 列，共 %{count} 列），表：%{table}%{in_file}"
  ja: "SG-E040 %{err}（%{count} 列中 %{index} 列目）テーブル：%{table}%{in_file}"
table.duplicate_trigger:
  en: "SG-E041 Duplicate trigger name: %{name} on table: %{table}%{in_file}"
  ru: "SG-E041 повторное имя триггера: %{name} в таблице: %{table}%{in_file}"
  fr: "SG-E041 nom de trigger en double : %{name} sur la table : %{table}%{in_file}"
  de: "SG-E041 doppelter Triggername: %{name} in Tabelle: %{table}%{in_file}"
  zh: "SG-E041 触发器名称重复：%{name}，表：%{table}%{in_file}"
  ja: "SG-E041 トリガー名の重複：%{name}、テーブル：%{table}%{in_file}"
table.partition_value:
  en: "SG-E042 Invalid partition_by value '%{value}' on column '%{column}' in table '%{table}'. Expected one of: RANGE, LIST, HASH%{in_file}"
  ru: "SG-E042 недопустимое значение partition_by '%{value}' у столбца '%{column}' в таблице '%{table}'. Ожидается одно из: RANGE, LIST, HASH%{in_file}"
  fr: "SG-E042 valeur partition_by '%{value}' invalide sur la colonne '%{column}' de la table '%{table}'. Attendu : RANGE, LIST ou HASH%{in_file}"
  de: "SG-E042 ungültiger partition_by-Wert '%{value}' in Spalte '%{column}' der Tabelle '%{table}'. Erwartet: RANGE, LIST oder HASH%{in_file}"
  zh: "SG-E042 表 '%{table}' 的列 '%{column}' 的 partition_by 值 '%{value}' 无效。应为 RANGE、LIST 或 HASH 之一%{in_file}"
  ja: "SG-E042 テーブル '%{table}' の列 '%{column}' の partition_by の値 '%{value}' は無効です。RANGE、LIST、HASH のいずれかを指定してください%{in_file}"
table.partition_many:
  en: "SG-E043 Only one column can have partition_by on table '%{table}'. Found multiple columns with partition_by%{in_file}"
  ru: "SG-E043 partition_by может быть только у одного столбца таблицы '%{table}', а найдено несколько%{in_file}"
  fr: "SG-E043 une seule colonne de la table '%{table}' peut avoir partition_by ; plusieurs en ont%{in_file}"
  de: "SG-E043 nur eine Spalte der Tabelle '%{table}' darf partition_by haben; mehrere haben es%{in_file}"
  zh: "SG-E043 表 '%{table}' 只能有一列设置 partition_by，但发现了多列%{in_file}"
  ja: "SG-E043 テーブル '%{table}' で partition_by を指定できる列は 1 つだけですが、複数の列に指定されています%{in_file}"
table.size_cut:
  en: "SG-E044 Column %{column} on %{table} type change from %{from} to %{to} requires size reduction but with_size_cut is disabled. SQL: %{sql};"
  ru: "SG-E044 смена типа столбца %{column} в %{table} с %{from} на %{to} уменьшает размер, а with_size_cut выключен. SQL: %{sql};"
  fr: "SG-E044 le changement de type de la colonne %{column} de %{table}, de %{from} à %{to}, réduit la taille, mais with_size_cut est désactivé. SQL : %{sql};"
  de: "SG-E044 die Typänderung der Spalte %{column} in %{table} von %{from} zu %{to} verkleinert die Größe, aber with_size_cut ist ausgeschaltet. SQL: %{sql};"
  zh: "SG-E044 %{table} 的列 %{column} 类型从 %{from} 改为 %{to} 需要缩小长度，但 with_size_cut 未开启。SQL：%{sql};"
  ja: "SG-E044 %{table} の列 %{column} の型を %{from} から %{to} に変えるとサイズが縮小しますが、with_size_cut が無効です。SQL：%{sql};"
table.type_change:
  en: "SG-E045 Column %{column} on %{table} has incompatible type change from %{from} to %{to} but with_size_cut is disabled. SQL: %{sql};"
  ru: "SG-E045 несовместимая смена типа столбца %{column} в %{table} с %{from} на %{to}, а with_size_cut выключен. SQL: %{sql};"
  fr: "SG-E045 changement de type incompatible de la colonne %{column} de %{table}, de %{from} à %{to}, et with_size_cut est désactivé. SQL : %{sql};"
  de: "SG-E045 inkompatible Typänderung der Spalte %{column} in %{table} von %{from} zu %{to}, und with_size_cut ist ausgeschaltet. SQL: %{sql};"
  zh: "SG-E045 %{table} 的列 %{column} 类型从 %{from} 改为 %{to} 不兼容，且 with_size_cut 未开启。SQL：%{sql};"
  ja: "SG-E045 %{table} の列 %{column} の型を %{from} から %{to} に変えるのは互換性がなく、with_size_cut も無効です。SQL：%{sql};"
table.trigger_changed:
  en: "SG-E046 Trigger %{name} on %{table} has changed, and with_trigger_drop and without_failfast are both off. SQL would be:\n%{drop}\n%{create}"
  ru: "SG-E046 триггер %{name} в %{table} изменился, а with_trigger_drop и without_failfast оба выключены. SQL был бы таким:\n%{drop}\n%{create}"
  fr: "SG-E046 le trigger %{name} de %{table} a changé, et with_trigger_drop et without_failfast sont tous deux désactivés. Le SQL serait :\n%{drop}\n%{create}"
  de: "SG-E046 Trigger %{name} in %{table} hat sich geändert, und with_trigger_drop und without_failfast sind beide ausgeschaltet. Das SQL wäre:\n%{drop}\n%{create}"
  zh: "SG-E046 %{table} 上的触发器 %{name} 已更改，而 with_trigger_drop 和 without_failfast 都未开启。SQL 将是：\n%{drop}\n%{create}"
  ja: "SG-E046 %{table} のトリガー %{name} が変更されましたが、with_trigger_drop と without_failfast がどちらも無効です。実行される SQL：\n%{drop}\n%{create}"
table.pk_changed:
  en: "SG-E047 Primary key on %{table} has changed from %{from} to %{to} but with_index_drop is disabled. SQL would be:\n%{drop}%{add}"
  ru: "SG-E047 первичный ключ %{table} изменился с %{from} на %{to}, а with_index_drop выключен. SQL был бы таким:\n%{drop}%{add}"
  fr: "SG-E047 la clé primaire de %{table} a changé de %{from} à %{to}, mais with_index_drop est désactivé. Le SQL serait :\n%{drop}%{add}"
  de: "SG-E047 der Primärschlüssel von %{table} hat sich von %{from} zu %{to} geändert, aber with_index_drop ist ausgeschaltet. Das SQL wäre:\n%{drop}%{add}"
  zh: "SG-E047 %{table} 的主键已从 %{from} 改为 %{to}，但 with_index_drop 未开启。SQL 将是：\n%{drop}%{add}"
  ja: "SG-E047 %{table} の主キーが %{from} から %{to} に変更されましたが、with_index_drop が無効です。実行される SQL：\n%{drop}%{add}"
table.exec:
  en: "SG-E048 DB execute [%{sql}]%{source}\nThe error is: %{err}"
  ru: "SG-E048 выполнение в базе [%{sql}]%{source}\nОшибка: %{err}"
  fr: "SG-E048 exécution en base [%{sql}]%{source}\nErreur : %{err}"
  de: "SG-E048 Ausführung in der Datenbank [%{sql}]%{source}\nFehler: %{err}"
  zh: "SG-E048 数据库执行 [%{sql}]%{source}\n错误：%{err}"
  ja: "SG-E048 データベースでの実行 [%{sql}]%{source}\nエラー：%{err}"
table.exec_comments:
  en: "SG-E049 DB execute comments [%{sql}]%{source}\nThe error is: %{err}"
  ru: "SG-E049 выполнение комментариев в базе [%{sql}]%{source}\nОшибка: %{err}"
  fr: "SG-E049 exécution des commentaires en base [%{sql}]%{source}\nErreur : %{err}"
  de: "SG-E049 Ausführung der Kommentare in der Datenbank [%{sql}]%{source}\nFehler: %{err}"
  zh: "SG-E049 数据库执行注释 [%{sql}]%{source}\n错误：%{err}"
  ja: "SG-E049 データベースでのコメントの実行 [%{sql}]%{source}\nエラー：%{err}"
table.exec_indexes:
  en: "SG-E050 DB execute indexes [%{sql}]%{source}\nThe error is: %{err}"
  ru: "SG-E050 выполнение индексов в базе [%{sql}]%{source}\nОшибка: %{err}"
  fr: "SG-E050 exécution des index en base [%{sql}]%{source}\nErreur : %{err}"
  de: "SG-E050 Ausführung der Indizes in der Datenbank [%{sql}]%{source}\nFehler: %{err}"
  zh: "SG-E050 数据库执行索引 [%{sql}]%{source}\n错误：%{err}"
  ja: "SG-E050 データベースでのインデックスの実行 [%{sql}]%{source}\nエラー：%{err}"
table.exec_grants:
  en: "SG-E051 DB execute grants [%{sql}]%{source}\nThe error is: %{err}"
  ru: "SG-E051 выполнение прав доступа в базе [%{sql}]%{source}\nОшибка: %{err}"
  fr: "SG-E051 exécution des droits en base [%{sql}]%{source}\nErreur : %{err}"
  de: "SG-E051 Ausführung der Rechte in der Datenbank [%{sql}]%{source}\nFehler: %{err}"
  zh: "SG-E051 数据库执行权限 [%{sql}]%{source}\n错误：%{err}"
  ja: "SG-E051 データベースでの権限の実行 [%{sql}]%{source}\nエラー：%{err}"
table.exec_data:
  en: "SG-E052 DB execute data upserts [%{sql}]%{source}\nThe error is: %{err}"
  ru: "SG-E052 выполнение вставки данных в базе [%{sql}]%{source}\nОшибка: %{err}"
  fr: "SG-E052 exécution de l'insertion des données en base [%{sql}]%{source}\nErreur : %{err}"
  de: "SG-E052 Ausführung des Dateneinfügens in der Datenbank [%{sql}]%{source}\nFehler: %{err}"
  zh: "SG-E052 数据库执行数据写入 [%{sql}]%{source}\n错误：%{err}"
  ja: "SG-E052 データベースでのデータ書き込みの実行 [%{sql}]%{source}\nエラー：%{err}"
table.fk_execute:
  en: "SG-E053 DB FK execute [%{sql}]: %{err}%{source}"
  ru: "SG-E053 выполнение внешнего ключа в базе [%{sql}]: %{err}%{source}"
  fr: "SG-E053 exécution de la clé étrangère en base [%{sql}] : %{err}%{source}"
  de: "SG-E053 Ausführung des Fremdschlüssels in der Datenbank [%{sql}]: %{err}%{source}"
  zh: "SG-E053 数据库执行外键 [%{sql}]：%{err}%{source}"
  ja: "SG-E053 データベースでの外部キーの実行 [%{sql}]：%{err}%{source}"
table.log_deploy_sql:
  en: "deploy SQL"
  ru: "SQL развёртывания"
  fr: "SQL de déploiement"
  de: "Bereitstellungs-SQL"
  zh: "部署 SQL"
  ja: "デプロイ SQL"
column.definition:
  en: "SG-E060 Error column definition on table: %{table} column %{column} file %{file}"
  ru: "SG-E060 ошибка определения столбца в таблице: %{table}, столбец %{column}, файл %{file}"
  fr: "SG-E060 erreur de définition de colonne, table : %{table}, colonne %{column}, fichier %{file}"
  de: "SG-E060 Fehler in der Spaltendefinition, Tabelle: %{table}, Spalte %{column}, Datei %{file}"
  zh: "SG-E060 列定义错误，表：%{table}，列 %{column}，文件 %{file}"
  ja: "SG-E060 列定義のエラー。テーブル：%{table}、列 %{column}、ファイル %{file}"
grant.changed:
  en: "SG-E061 Grant changes detected for %{grantee} on %{table}, and with_revoke and without_failfast are both off. SQL: %{sql}"
  ru: "SG-E061 изменились права %{grantee} на %{table}, а with_revoke и without_failfast оба выключены. SQL: %{sql}"
  fr: "SG-E061 droits modifiés pour %{grantee} sur %{table}, et with_revoke et without_failfast sont tous deux désactivés. SQL : %{sql}"
  de: "SG-E061 geänderte Rechte für %{grantee} auf %{table}, und with_revoke und without_failfast sind beide ausgeschaltet. SQL: %{sql}"
  zh: "SG-E061 检测到 %{grantee} 在 %{table} 上的权限变更，而 with_revoke 和 without_failfast 都未开启。SQL：%{sql}"
  ja: "SG-E061 %{table} に対する %{grantee} の権限の変更を検出しましたが、with_revoke と without_failfast がどちらも無効です。SQL：%{sql}"
grant.removed:
  en: "SG-E062 Grant removal detected for %{grantee} on %{table}, and with_revoke and without_failfast are both off. SQL: %{sql}"
  ru: "SG-E062 удалены права %{grantee} на %{table}, а with_revoke и without_failfast оба выключены. SQL: %{sql}"
  fr: "SG-E062 droits retirés pour %{grantee} sur %{table}, et with_revoke et without_failfast sont tous deux désactivés. SQL : %{sql}"
  de: "SG-E062 entfernte Rechte für %{grantee} auf %{table}, und with_revoke und without_failfast sind beide ausgeschaltet. SQL: %{sql}"
  zh: "SG-E062 检测到 %{grantee} 在 %{table} 上的权限被移除，而 with_revoke 和 without_failfast 都未开启。SQL：%{sql}"
  ja: "SG-E062 %{table} に対する %{grantee} の権限の削除を検出しましたが、with_revoke と without_failfast がどちらも無効です。SQL：%{sql}"
index.changed:
  en: "SG-E063 Index %{name} on %{table} has changed, and with_index_drop and without_failfast are both off. SQL would be:\n%{drop}\n%{create}"
  ru: "SG-E063 индекс %{name} в %{table} изменился, а with_index_drop и without_failfast оба выключены. SQL был бы таким:\n%{drop}\n%{create}"
  fr: "SG-E063 l'index %{name} de %{table} a changé, et with_index_drop et without_failfast sont tous deux désactivés. Le SQL serait :\n%{drop}\n%{create}"
  de: "SG-E063 Index %{name} in %{table} hat sich geändert, und with_index_drop und without_failfast sind beide ausgeschaltet. Das SQL wäre:\n%{drop}\n%{create}"
  zh: "SG-E063 %{table} 上的索引 %{name} 已更改，而 with_index_drop 和 without_failfast 都未开启。SQL 将是：\n%{drop}\n%{create}"
  ja: "SG-E063 %{table} のインデックス %{name} が変更されましたが、with_index_drop と without_failfast がどちらも無効です。実行される SQL：\n%{drop}\n%{create}"
