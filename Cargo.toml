[package]
name = "schema_guard_tokio"
version = "2.4.1"
authors = ["V.Krinitsyn <V.Krinitsyn@gmail.com>"]
edition = "2024"
description = "Schema Guard: YAML based Relation Database Schema Management tool for Postgres"
homepage = "https://github.com/vkrinitsyn/schema_guard"
readme = "README.md"
documentation = "https://www.dbinvent.com/sge/guide/getting-started#declarative"
repository = "https://github.com/vkrinitsyn/schema_guard"
license = "MIT"
keywords = ["schema_guard", "sge", "postgres", "sql"]
links = "https://dbinvent.com/"

[lib]
name = "schema_guard_tokio"
path = "src/lib.rs"

[dependencies]

slog = { version = "^2.8", features=["max_level_debug"] }
lazy_static = "^1.5"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
# default features add only encoding_rs, for byte input; schema_guard parses strings
yaml-rust2 = { version = "^0.13", default-features = false }
# yaml-validator 0.2.0, vendored in src/yaml_validator, needs these two
regex = "^1.11"
thiserror = "^2.0"
# [db] the runtime PostgreSQL's driver runs on: with its feature (and for the tests)
tokio = { version = "^1.54.1", features = ["test-util", "full"], optional = true }
tokio-postgres = { version = "^0.7.18", optional = true }
# [sqlite] SQLite, embedded: turso, as yt-lite uses it (owner, 2026-11-19) - no system library
turso = { version = "=0.9.0-pre.5", optional = true }
# [mysql] MySQL through sqlx (its MySQL driver, pure Rust, on tokio): no client library. 0.9 with TLS
# (rustls) and without its RSA: sqlx 0.8 took rsa 0.9 (RUSTSEC-2023-0071, cargo audit failed, 2026-11-19);
# MySQL 8's caching_sha2 sign-in goes over TLS, which its server makes by itself
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-webpki"] }
# the messages, in locales/*.yml: compiled in, each in every language - see src/i18n.rs
# (no i18n table name in brackets anywhere in this file: rust-i18n would read it as
# its configuration)
rust-i18n = "^4.2.4"

[dev-dependencies]
tokio = { version = "^1.54.1", features = ["test-util", "full"] }

[features]
# [db] one feature a database, PostgreSQL's by default (owner, 2026-11-17): each database is a
# binary of its own (sge, ...), built with its feature. Without one, the schema's model only:
# its YAML read and checked, and compared with a loaded one - no database read or changed
default = ["postgres"]
postgres = ["dep:tokio-postgres", "dep:tokio"]
# [sqlite] SQLite (owner, 2026-11-18): src/sqlite.rs
sqlite = ["dep:turso"]
# [mysql] MySQL (owner, 2026-11-19): src/mysql.rs
mysql = ["dep:sqlx", "dep:tokio"]
#default = ["slog"]
# show extra messages when do SQL execution using slog logger
slog = []

# [db] the tests against a live PostgreSQL: with its feature only
[[test]]
name = "data_rows"
required-features = ["postgres"]

[[test]]
name = "pg_errors"
required-features = ["postgres"]

[[test]]
name = "plan"
required-features = ["postgres"]

[[test]]
name = "sqlite_samples"
required-features = ["sqlite"]


[[test]]
name = "mysql_samples"
required-features = ["mysql"]
